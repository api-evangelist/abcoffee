  bearerFormat: JWT
  applies_to:
  - 'mcp:get_order'
  evidence: >-
    A tools/call for get_order without a token returns JSON-RPC error -32000 "AuthenticationRequired"
    with HTTP 403 and the message "Unauthorized: A valid JWT is required to call get_order. See
    https://shopify.dev/docs/agents/get-started/authentication".
  docs: https://shopify.dev/docs/agents/get-started/authentication
  sources: ['probe: POST https://abcoffee.in/api/ucp/mcp tools/call get_order']
- name: ucp-agent-profile
  type: other
  description: >-
    Every MCP tool requires meta["ucp-agent"].profile - a URI pointing at the calling agent's UCP
    profile. It is an agent-identity requirement rather than an authorization credential; omitting it
    returns JSON-RPC -32001 "UCP discovery failed" / invalid_profile_url with HTTP 422.
  sources: [mcp/abcoffee-mcp-tools.json]
anonymous_access:
  description: >-
    MCP initialize and tools/list are callable with no credential at all (HTTP 200). The read-only
    storefront surface documented in llms.txt (/products/{handle}.json,
    /collections/{handle}/products.json, /search) is also unauthenticated.
  evidence:
  - {url: 'https://abcoffee.in/api/ucp/mcp', method: 'tools/list', status: 200}
  - {url: 'https://abcoffee.in/api/ucp/mcp', method: 'initialize', status: 200}
  - {url: 'https://abcoffee.in/products.json', status: 200}
