aid: abcoffee
name: Abcoffee
description: >-
  abcoffee (abCoffee, legally AB Coffee India) is a Mumbai-founded, tech-enabled grab-and-go specialty
  coffee chain operating 90+ kiosk, high-street and corporate outlets across Mumbai, Delhi-NCR and
  Bengaluru. Founded in 2022 by Abhijeet Anand, the company sources beans directly from Indian growing
  regions such as Chikmagalur and sells through its own takeaway mobile app and subscription ecosystem
  alongside its stores. Its public machine-readable surface is not a developer API program but an
  agentic-commerce one - the abcoffee.in storefront runs on Shopify and publishes an llms.txt/agents.md
  agent instruction document, a Universal Commerce Protocol (UCP) merchant profile at /.well-known/ucp,
  OpenID Connect and OAuth 2.0 discovery metadata for Shopify Customer Accounts, and a live,
  anonymously-listable MCP endpoint at /api/ucp/mcp exposing 13 catalog, cart, checkout and order tools.
