apis:
- name: abcoffee Agentic Commerce (UCP over MCP)
  description: >-
    The agent-facing commerce surface of the abcoffee online store. Implemented as Shopify's native
    Universal Commerce Protocol (UCP) service and exposed over MCP at abcoffee's own domain, it offers
    13 tools covering catalog search and lookup, product detail, cart create/update/cancel, checkout
    create/update/complete/cancel and order retrieval. tools/list and initialize answer anonymously;
    order retrieval requires a Shopify agent JWT and checkout completion requires a buyer-approved
    payment plus a required idempotency key.
  humanURL: https://abcoffee.in/agents.md
  image: https://abcoffee.in/cdn/shop/t/24/assets/favicon-512.png
  baseURL: https://abcoffee.in/api/ucp/mcp
